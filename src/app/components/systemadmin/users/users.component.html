<app-page-header
  [title]="'System Admin'"
  [title1]="['Users']"
  [activeitem]="'Users'">
</app-page-header>

<div class="box">
  <div class="box-header">
    <h5 class="box-title">Users</h5>
  </div>

<div class="box-body relative overflow-x-auto">

  <!-- OVERLAY DE LOADING -->
  <div *ngIf="loading" class="table-overlay">
    <div class="ti-spinner" role="status">
      <span class="sr-only">Loading...</span>
    </div>
  </div>

  <!--  TABLA -->
  <table
    mat-table
    [dataSource]="dataSource"
    class="w-full"
    [class.pointer-events-none]="loading"
    [class.opacity-50]="loading"
  >

    <!-- ID -->
    <ng-container matColumnDef="id">
      <th mat-header-cell *matHeaderCellDef>ID</th>
      <td mat-cell *matCellDef="let user">{{ user.id }}</td>
    </ng-container>

    <!-- Name -->
    <ng-container matColumnDef="name">
      <th mat-header-cell *matHeaderCellDef>Name</th>
      <td mat-cell *matCellDef="let user">{{ user.name }}</td>
    </ng-container>

    <!-- Email -->
    <ng-container matColumnDef="email">
      <th mat-header-cell *matHeaderCellDef>Email</th>
      <td mat-cell *matCellDef="let user">{{ user.email }}</td>
    </ng-container>

    <!-- Role -->
    <ng-container matColumnDef="rol_id">
      <th mat-header-cell *matHeaderCellDef>Role</th>
      <td mat-cell *matCellDef="let user">{{ user.rol_id }}</td>
    </ng-container>

    <!-- Organization -->
    <ng-container matColumnDef="organization_id">
      <th mat-header-cell *matHeaderCellDef>Organization</th>
      <td mat-cell *matCellDef="let user">{{ user.organization_id }}</td>
    </ng-container>

    <!-- Status -->
    <ng-container matColumnDef="is_active">
      <th mat-header-cell *matHeaderCellDef>Status</th>
      <td mat-cell *matCellDef="let user">
        <span
          class="px-2 py-1 rounded text-xs"
          [ngClass]="user.is_active ? 'bg-green-600 text-white' : 'bg-red-600 text-white'">
          {{ user.is_active ? 'Active' : 'Inactive' }}
        </span>
      </td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>

  </table>

  <mat-paginator
    [pageSize]="5"
    [pageSizeOptions]="[5, 10, 20]"
    showFirstLastButtons>
  </mat-paginator>

  <div *ngIf="!dataSource.data.length && !loading" class="text-center py-6 text-gray-400">
    No users found
  </div>

</div>

</div>
