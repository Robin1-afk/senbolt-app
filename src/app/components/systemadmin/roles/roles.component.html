<app-page-header
  [title]="i18n.translate('roles.pageTitle')"
  [title1]="[i18n.translate('roles.pageBreadcrumb')]"
  [activeitem]="i18n.translate('roles.pageBreadcrumb')"
  >
</app-page-header>

<div class="grid grid-cols-12 gap-6">
  <div class="col-span-12">
    <div class="box">
      <div class="box-header">
        <h5 class="box-title">{{ i18n.translate('roles.title_table') }}</h5>
      </div>

      <div class="box-body">
        <dual-list
        [source]="source"
        [(destination)]="confirmed"
        [key]="key"
        [display]="display"
        [sort]="keepSorted"
        [filter]="filter"
        [disabled]="disabled"
        height="300px"
        [format]="format">
        </dual-list>
      </div>
    </div>
  </div>
</div>
