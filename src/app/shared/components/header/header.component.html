  <!-- app-header -->
  <header class="app-header" id="header" [ngClass]="{ 'sticky-pin': scrolled }">

    <!-- Start::main-header-container -->
    <div class="main-header-container container-fluid">
        <!-- Start::header-content-left -->
        <div class="header-content-left">
            <!-- Start::header-element -->
            <div class="header-element">
                <div class="horizontal-logo">
                    <a [routerLink]="['/dashboards/sales']" class="header-logo"> 
                        <img src="./assets/images/brand-logos/desktop-logo.png" alt="logo" class="desktop-logo"> 
                        <img src="./assets/images/brand-logos/toggle-dark.png" alt="logo" class="toggle-dark"> 
                        <img src="./assets/images/brand-logos/desktop-dark.png" alt="logo" class="desktop-dark"> 
                        <img src="./assets/images/brand-logos/toggle-logo.png" alt="logo" class="toggle-logo"> 
                        <img src="./assets/images/brand-logos/toggle-white.png" alt="logo" class="toggle-white"> 
                        <img src="./assets/images/brand-logos/desktop-white.png" alt="logo" class="desktop-white"> 
                    </a>
                </div>
            </div>
            <!-- End::header-element -->

            <!-- Start::header-element -->
            <div class="header-element mx-lg-0">
                <a aria-label="Hide Sidebar" (click)="toggleSidebar()"
                    class="sidemenu-toggle header-link animated-arrow hor-toggle horizontal-navtoggle"
                    data-bs-toggle="sidebar" href="javascript:void(0);"><span></span></a>
            </div>
            <!-- End::header-element -->

            <!-- Start::header-element -->
            <div class="header-element header-search md:!block !hidden my-auto auto-complete-search">
                <!-- Start::header-link -->
                <input type="text" class="header-search-bar form-control" id="header-search" placeholder="'Search anything here ...'" spellcheck=false (click)="SearchHeader()"
                [(ngModel)]="text"
                [ngModelOptions]="{ standalone: true }"
                (keyup)="Search(text)"
                    [placeholder]="'Search anything here ...'"  autocomplete="off" autocapitalize="off">
                <a aria-label="anchor" href="javascript:void(0);" class="header-search-icon border-0">
                    <i class="ri-search-line"></i>
                </a>
                <!-- End::header-link -->
                <div
                class="absolute w-full bg-white shadow-md mt-1 rounded-md border border-gray-300"
                *ngIf="menuItems?.length"
              >
                <div class="p-4 border-b border-gray-200">
                  <h4 class="text-lg font-medium text-gray-700 mb-1">
                    Search result of "{{ text }}"
                  </h4>
                  <small class="text-sm text-gray-500">Limit dropdown to 5 items</small>
                </div>
                <ul class="divide-y divide-gray-200">
                    <li
                        *ngFor="let menuItem of menuItems | slice: 0: 5"
                        [routerLink]="menuItem?.path"
                        class="p-3 hover:bg-gray-100 cursor-pointer text-gray-700 flex items-center"
                        (click)="clearSearch()"
                    >
                        <i class="fa fa-angle-double-right mr-2 text-gray-500"></i>

                    <span class="truncate">
                    {{ translate(menuItem?.title) }}
                    </span>
                    </li>
                </ul>
              </div>
                <!-- <div class="search-result p-absolute w-100 card border mt-1" *ngIf="menuItems?.length;">
                    <div class="card-header">
                      <h4 class="card-title me-2">Search result of "{{text}}" </h4> <small> limit dropdown 5 only</small>
                    </div>
                    <ul class="list-group text-break">
                      <li *ngFor="let menuItem of menuItems | slice:0:5" [routerLink]="menuItem?.path"
                        class="list-group-item header-list-group border-start-end-top-0 br-0" (click)="clearSearch()">
                        <i class="fa fa-angle-double-right me-2" aria-hidden="true"></i>{{menuItem?.title}}
                      </li>
                    </ul>
                  </div> -->
            </div>
            <!-- End::header-element -->

        </div>
        <!-- End::header-content-left -->

        <!-- Start::header-content-right -->
        <ul class="header-content-right">

            <!-- Start::header-element -->
            <li class="header-element md:!hidden block">
                <a aria-label="anchor" href="javascript:void(0);" class="header-link" data-bs-toggle="modal"
                    data-hs-overlay="#header-responsive-search">
                    <!-- Start::header-link-icon -->
                    <i class="bi bi-search header-link-icon"></i>
                    <!-- End::header-link-icon -->
                </a>
            </li>
            <!-- End::header-element -->

            <!-- Start::header-element -->
            <li
                class="header-element country-selector hs-dropdown ti-dropdown  hidden sm:block [--placement:bottom-right] rtl:[--placement:bottom-left]">
                <div class="ti-dropdown-divider divide-y divide-gray-200 dark:divide-white/10"></div>
                <!-- Start::header-link|dropdown-toggle -->
                <a aria-label="anchor"  href="javascript:void(0);" class="header-link hs-dropdown-toggle ti-dropdown-toggle"
                    data-bs-auto-close="outside" data-bs-toggle="dropdown">
                    <svg xmlns="http://www.w3.org/2000/svg" class="w-6 h-6 header-link-icon" fill="none"
                        viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round"
                            d="m10.5 21 5.25-11.25L21 21m-9-3h7.5M3 5.621a48.474 48.474 0 0 1 6-.371m0 0c1.12 0 2.233.038 3.334.114M9 5.25V3m3.334 2.364C11.176 10.658 7.69 15.08 3 17.502m9.334-12.138c.896.061 1.785.147 2.666.257m-4.589 8.495a18.023 18.023 0 0 1-3.827-5.802" />
                    </svg>
                </a>
                <!-- End::header-link|dropdown-toggle -->
                <ul class="main-header-dropdown hs-dropdown-menu ti-dropdown-menu min-w-[10rem] hidden"
                    data-popper-placement="none">
                    <li>
                        <a class="ti-dropdown-item flex items-center"  (click)="changeLanguage('en')">
                            <div class="flex items-center justify-between">
                                <div class="flex items-center">
                                    <span class="avatar avatar-rounded avatar-xs leading-none me-2">
                                        <img src="./assets/images/flags/us_flag.jpg" alt="img">
                                    </span>
                                    English
                                </div>
                            </div>
                        </a>
                    </li>
                    <li>
                        <a class="ti-dropdown-item flex items-center" (click)="changeLanguage('es')">
                            <div class="flex items-center justify-between">
                                <div class="flex items-center">
                                    <span class="avatar avatar-rounded avatar-xs leading-none me-2">
                                        <img src="./assets/images/flags/spain_flag.jpg" alt="img">
                                    </span>
                                    Español
                                </div>
                            </div>
                        </a>
                    </li>
                    <li>
                        <a class="ti-dropdown-item flex items-center" (click)="changeLanguage('fr')">
                            <div class="flex items-center justify-between">
                                <div class="flex items-center">
                                    <span class="avatar avatar-rounded avatar-xs leading-none me-2">
                                        <img src="./assets/images/flags/french_flag.jpg" alt="img">
                                    </span>
                                    Français
                                </div>
                            </div>
                        </a>
                    </li>
                </ul>
            </li>
            <!-- End::header-element -->
            <!-- Start::header-element -->
            <!-- light and dark theme -->
            <li class="header-element header-theme-mode hidden !items-center sm:block md:!px-[0.5rem] px-2">
                <a aria-label="anchor" (click)="updateTheme('dark')"
                    class="hs-dark-mode-active:hidden flex hs-dark-mode group flex-shrink-0 justify-center items-center gap-2  rounded-full font-medium transition-all text-xs dark:bg-bgdark dark:hover:bg-black/20 text-textmuted dark:text-textmuted/50 dark:hover:text-white dark:focus:ring-white/10 dark:focus:ring-offset-white/10"
                    href="javascript:void(0);" data-hs-theme-click-value="dark">
                    <svg xmlns="http://www.w3.org/2000/svg" class="w-6 h-6 header-link-icon" fill="none"
                        viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round"
                            d="M21.752 15.002A9.72 9.72 0 0 1 18 15.75c-5.385 0-9.75-4.365-9.75-9.75 0-1.33.266-2.597.748-3.752A9.753 9.753 0 0 0 3 11.25C3 16.635 7.365 21 12.75 21a9.753 9.753 0 0 0 9.002-5.998Z" />
                    </svg>
                </a>
                <a aria-label="anchor"(click)="updateTheme('light')"
                    class="hs-dark-mode-active:flex hidden hs-dark-mode group flex-shrink-0 justify-center items-center gap-2  rounded-full font-medium text-defaulttextcolor  transition-all text-xs dark:bg-bodybg dark:bg-bgdark dark:hover:bg-black/20  dark:hover:text-white dark:focus:ring-white/10 dark:focus:ring-offset-white/10"
                    href="javascript:void(0);" data-hs-theme-click-value="light">
                    <svg xmlns="http://www.w3.org/2000/svg" class="w-6 h-6 header-link-icon" fill="none"
                        viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round"
                            d="M12 3v2.25m6.364.386-1.591 1.591M21 12h-2.25m-.386 6.364-1.591-1.591M12 18.75V21m-4.773-4.227-1.591 1.591M5.25 12H3m4.227-4.773L5.636 5.636M15.75 12a3.75 3.75 0 1 1-7.5 0 3.75 3.75 0 0 1 7.5 0Z" />
                    </svg>
                </a>
            </li>
            <!-- End light and dark theme -->

            <!-- End::header-element -->

            <!-- Start::header-element -->
             
            <!-- End::header-element -->

            <!-- Start::header-element -->

            <!-- End::header-element -->

            <!-- Start::header-element -->
            <li class="header-element header-fullscreen" appFullscreen>
                <!-- Start::header-link -->
                <a (click)="toggleFullscreen()"  href="javascript:void(0);" class="header-link" aria-label="anchor">
                    <svg [ngClass]="{ 'hidden': isFullscreen }" xmlns="http://www.w3.org/2000/svg" class="w-6 h-6 full-screen-open header-link-icon"
                        fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round"
                            d="M3.75 3.75v4.5m0-4.5h4.5m-4.5 0L9 9M3.75 20.25v-4.5m0 4.5h4.5m-4.5 0L9 15M20.25 3.75h-4.5m4.5 0v4.5m0-4.5L15 9m5.25 11.25h-4.5m4.5 0v-4.5m0 4.5L15 15" />
                    </svg>
                    <svg [ngClass]="{ 'hidden': !isFullscreen }" xmlns="http://www.w3.org/2000/svg" class="w-6 h-6 full-screen-close header-link-icon hidden"
                        fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round"
                            d="M9 9V4.5M9 9H4.5M9 9 3.75 3.75M9 15v4.5M9 15H4.5M9 15l-5.25 5.25M15 9h4.5M15 9V4.5M15 9l5.25-5.25M15 15h4.5M15 15v4.5m0-4.5 5.25 5.25" />
                    </svg>
                </a>
                <!-- End::header-link -->
            </li>
            <!-- End::header-element -->

            <!-- Start::header-element -->
            <li class="header-element ti-dropdown hs-dropdown">
                <!-- Start::header-link|dropdown-toggle -->
                <a aria-label="anchor"  href="javascript:void(0);" class="header-link hs-dropdown-toggle ti-dropdown-toggle"
                    id="mainHeaderProfile" data-bs-toggle="dropdown" data-bs-auto-close="outside" aria-expanded="false">
                    <div class="flex items-center">
                        <div>
                            <img src="./assets/images/faces/15.jpg" alt="img" class="avatar avatar-sm mb-0">
                        </div>
                    </div>
                </a>
                <!-- End::header-link|dropdown-toggle -->
                <ul class="main-header-dropdown hs-dropdown-menu ti-dropdown-menu pt-0 overflow-hidden header-profile-dropdown hidden"
                    aria-labelledby="mainHeaderProfile">
                    <li>
                        <div
                            class="ti-dropdown-item text-center border-b border-defaultborder dark:border-defaultborder/10 block">
                            <span>
                                Mr.Henry
                            </span>
                            <span class="block text-xs text-textmuted dark:text-textmuted/50">UI/UX Designer</span>
                        </div>
                    </li>
                    <li><a class="ti-dropdown-item flex items-center" routerLink="/pages/profile"><i
                                class="fe fe-user p-1 rounded-full bg-primary/10 text-primary me-2 text-[1rem]"></i>Profile</a>
                    </li>
                    <li><a class="ti-dropdown-item flex items-center" routerLink="/pages/email/mailapp"><i
                                class="fe fe-mail p-1 rounded-full bg-primary/10 text-primary me-2 text-[1rem]"></i>Mail
                            Inbox</a></li>
                    <li><a class="ti-dropdown-item flex items-center" routerLink="/pages/file-manager"><i
                                class="fe fe-database p-1 rounded-full bg-primary/10 text-primary klist me-2 text-[1rem]"></i>File
                            Manger<span
                                class="badge bg-primarytint1color text-white ms-auto text-[0.5625rem]">2</span></a></li>
                    <li><a class="ti-dropdown-item flex items-center" routerLink="/pages/email/mail-settings"><i
                                class="fe fe-settings p-1 rounded-full bg-primary/10 text-primary ings me-2 text-[1rem]"></i>Settings</a>
                    </li>
                    <li class="border-t border-defaultborder dark:border-defaultborder/10 bg-light"><a
                            class="ti-dropdown-item flex items-center" routerLink="/pages/chat"><i
                                class="fe fe-help-circle p-1 rounded-full bg-primary/10 text-primary set me-2 text-[1rem]"></i>Help</a>
                    </li>
                    <li>
                        <a class="ti-dropdown-item flex items-center" (click)="logout()"><i
                                class="fe fe-lock p-1 rounded-full bg-primary/10 text-primary ut me-2 text-[1rem]"></i>Log Out
                        </a>
                    </li>
                </ul>
            </li>
            <!-- End::header-element -->

            <!-- Start::header-element -->
            <li class="header-element">
                <!-- Start::header-link|switcher-icon -->
                <a href="javascript:void(0);" class="header-link switcher-icon" data-hs-overlay="#hs-overlay-switcher" aria-label="anchor">
                    <svg xmlns="http://www.w3.org/2000/svg" class="w-6 h-6 header-link-icon" fill="none"
                        viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round"
                            d="M9.594 3.94c.09-.542.56-.94 1.11-.94h2.593c.55 0 1.02.398 1.11.94l.213 1.281c.063.374.313.686.645.87.074.04.147.083.22.127.325.196.72.257 1.075.124l1.217-.456a1.125 1.125 0 0 1 1.37.49l1.296 2.247a1.125 1.125 0 0 1-.26 1.431l-1.003.827c-.293.241-.438.613-.43.992a7.723 7.723 0 0 1 0 .255c-.008.378.137.75.43.991l1.004.827c.424.35.534.955.26 1.43l-1.298 2.247a1.125 1.125 0 0 1-1.369.491l-1.217-.456c-.355-.133-.75-.072-1.076.124a6.47 6.47 0 0 1-.22.128c-.331.183-.581.495-.644.869l-.213 1.281c-.09.543-.56.94-1.11.94h-2.594c-.55 0-1.019-.398-1.11-.94l-.213-1.281c-.062-.374-.312-.686-.644-.87a6.52 6.52 0 0 1-.22-.127c-.325-.196-.72-.257-1.076-.124l-1.217.456a1.125 1.125 0 0 1-1.369-.49l-1.297-2.247a1.125 1.125 0 0 1 .26-1.431l1.004-.827c.292-.24.437-.613.43-.991a6.932 6.932 0 0 1 0-.255c.007-.38-.138-.751-.43-.992l-1.004-.827a1.125 1.125 0 0 1-.26-1.43l1.297-2.247a1.125 1.125 0 0 1 1.37-.491l1.216.456c.356.133.751.072 1.076-.124.072-.044.146-.086.22-.128.332-.183.582-.495.644-.869l.214-1.28Z" />
                        <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 1 1-6 0 3 3 0 0 1 6 0Z" />
                    </svg>
                </a>
                <!-- End::header-link|switcher-icon -->
            </li>
            <!-- End::header-element -->

        </ul>
        <!-- End::header-content-right -->

    </div>
    <!-- End::main-header-container -->

</header>
<!-- /app-header -->

<div class="hs-overlay ti-modal hidden" id="header-responsive-search" aria-labelledby="header-responsive-search" aria-overlay="true" tabindex="-1"> 
    <div class="ti-modal-box"> 
        <div class="ti-modal-dialog"> 
         <div class="ti-modal-content"> 
            <div class="ti-modal-body"> 
                <div class="input-group"> 
                    <input type="text" class="form-control border-end-0 !border-s" placeholder="Search Anything ..." aria-label="Search Anything ..." aria-describedby="button-addon2">
                     <button aria-label="button" class="ti-btn ti-btn-primary !m-0" type="button" id="button-addon2"><i class="bi bi-search"></i></button> 
                    </div> 
                </div> 
            </div> 
        </div> 
    </div> 
</div>
